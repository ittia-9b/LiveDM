<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weighted Matrix Tool</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .hidden {
            display: none;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }

        input[type="text"] {
            width: 200px;
            background-color: #333;
            color: #f0f0f0;
            border: 1px solid #555;
        }

        button {
            margin-right: 5px;
            background-color: #444;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 5px 10px;
        }

        .scale-container {
            margin-top: 20px;
        }

        .scale-gradient {
            height: 20px;
            background: linear-gradient(to right, #8b0000, #333, #006400);
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
        }

        #secondary-weights {
            margin-bottom: 10px;
        }

        .weight-control {
            display: inline-block;
            margin-right: 10px;
        }

        .product {
            display: block;
            width: 100%;
            height: 100%;
            padding: 8px;
            box-sizing: border-box;
            color: #f0f0f0;
        }

        .primary-weight,
        .secondary-weight {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <h1>Welcome to Weighted Matrix Tool</h1>
        <label for="title">Title:</label>
        <input type="text" id="title" value="Weighted Matrix"><br><br>
        <label for="primary">Primary Conditions (comma-separated):</label>
        <input type="text" id="primary" value="P1, P2, P3"><br><br>
        <label for="secondary">Secondary Conditions (comma-separated):</label>
        <input type="text" id="secondary" value="S1, S2, S3, S4"><br><br>
        <button id="create-button">Create Matrix</button>
    </div>

    <!-- Editor Screen -->
    <div id="editor-screen" class="hidden">
        <h1 id="matrix-title"></h1>
        <div id="secondary-weights"></div>
        <table id="matrix-table"></table>
        <div class="scale-container">
            <div class="scale-labels">
                <span id="min-label">Min: -25</span>
                <span>Neutral</span>
                <span id="max-label">Max: 25</span>
            </div>
            <div class="scale-gradient"></div>
        </div>
        <div>
            <label><input type="checkbox" id="dynamic-scale"> Live-Color Mode</label>
        </div>
        <div>
            <button id="save-button">Save Matrix</button>
            <button id="load-button">Load Matrix</button>
            <button id="add-row">Add Row</button>
            <button id="remove-row">Remove Row</button>
            <button id="add-column">Add Column</button>
            <button id="remove-column">Remove Column</button>
            <button id="export-markdown">Export to Markdown</button>
            <button id="back-button">Back</button>
        </div>
        <pre id="markdown-preview" style="white-space: pre-wrap;"></pre>
    </div>

    <script>
        let primaryConditions = [];
        let secondaryConditions = [];
        let isDynamicScale = false;

        // Calculate color based on value and range
        function getColor(value, min, max) {
            if (min === max) return 'rgb(51,51,51)'; // Neutral grey if no variation
            const normalized = (value - min) / (max - min);
            let r, g;
            if (normalized < 0.5) {
                const factor = normalized * 2;
                r = Math.round(139 + (51 - 139) * factor); // Dark red to grey
                g = Math.round(factor * 51);
            } else {
                const factor = (normalized - 0.5) * 2;
                r = Math.round(51 * (1 - factor));
                g = Math.round(51 + (100 - 51) * factor); // Grey to dark green
            }
            return `rgb(${r},${g},0)`;
        }

        // Update all product cells with values and colors
        function updateAllCells() {
            const primaryWeights = Array.from(document.querySelectorAll('.primary-weight')).map(span => parseInt(span.textContent) || 0);
            const secondaryWeights = Array.from(document.querySelectorAll('.cell-secondary-weight')).map(cell => parseInt(cell.dataset.secondaryWeight) || 1);
            const productCells = document.querySelectorAll('.product');
            const allProducts = [];

            productCells.forEach((cell, index) => {
                const row = Math.floor(index / secondaryConditions.length);
                const col = index % secondaryConditions.length;
                const secondaryWeight = parseInt(cell.dataset.secondaryWeight) || 1;
                const product = primaryWeights[row] * secondaryWeight;

                allProducts.push(product);
                cell.textContent = product;
                cell.dataset.product = product;
            });

            let min = isDynamicScale ? Math.min(...allProducts) : -25;
            let max = isDynamicScale ? Math.max(...allProducts) : 25;
            if (min === max) min = -25, max = 25; // Default range if no variation

            productCells.forEach(cell => {
                const product = parseInt(cell.dataset.product);
                cell.style.backgroundColor = getColor(product, min, max);
            });

            document.getElementById('min-label').textContent = `Min: ${min}`;
            document.getElementById('max-label').textContent = `Max: ${max}`;
        }

        // Build the matrix table
        function buildTable() {
            const table = document.getElementById('matrix-table');
            table.innerHTML = '';
            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            tr.appendChild(document.createElement('th')); // Empty top-left cell
            const weightTh = document.createElement('th');
            weightTh.textContent = 'Weight';
            tr.appendChild(weightTh);
            secondaryConditions.forEach(s => {
                const th = document.createElement('th');
                th.textContent = s;
                tr.appendChild(th);
            });
            thead.appendChild(tr);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            primaryConditions.forEach((p, i) => {
                const tr = document.createElement('tr');
                const labelTd = document.createElement('td');
                labelTd.textContent = p;
                tr.appendChild(labelTd);
                const weightTd = document.createElement('td');
                const weightSpan = document.createElement('span');
                weightSpan.className = 'primary-weight';
                weightSpan.dataset.row = i;
                weightSpan.textContent = '1';
                weightTd.appendChild(weightSpan);
                tr.appendChild(weightTd);
                secondaryConditions.forEach((s, j) => {
                    const td = document.createElement('td');
                    const span = document.createElement('span');
                    span.className = 'product';
                    span.dataset.secondaryWeight = '1'; // Default secondary weight
                    span.dataset.colIndex = j;
                    span.dataset.rowIndex = i;
                    td.appendChild(span);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            // Remove the secondary weights div content as it's no longer needed
            const secondaryWeightsDiv = document.getElementById('secondary-weights');
            secondaryWeightsDiv.innerHTML = '';

            addEventListeners();
            updateAllCells();
        }

        // Add event listeners for weight adjustments and interactions
        function addEventListeners() {
            document.querySelectorAll('.primary-weight').forEach(span => {
                span.addEventListener('click', function () {
                    const newWeight = prompt('Enter new weight (-10 to 10):', this.textContent);
                    if (newWeight !== null && !isNaN(newWeight)) {
                        this.textContent = newWeight;
                        updateAllCells();
                    }
                });
            });

            // Add event listeners for product cells
            document.querySelectorAll('.product').forEach(cell => {
                // Left click to decrement secondary weight
                cell.addEventListener('click', function (e) {
                    e.preventDefault();
                    const currentWeight = parseInt(this.dataset.secondaryWeight) || 1;
                    this.dataset.secondaryWeight = Math.max(-10, currentWeight - 1);
                    updateAllCells();
                });

                // Right click to increment secondary weight
                cell.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                    const currentWeight = parseInt(this.dataset.secondaryWeight) || 1;
                    this.dataset.secondaryWeight = Math.min(10, currentWeight + 1);
                    updateAllCells();
                });

                // Mouseover to show secondary weight
                cell.addEventListener('mouseover', function () {
                    this.dataset.originalText = this.textContent;
                    this.textContent = this.dataset.secondaryWeight;
                });

                // Mouseout to show product again
                cell.addEventListener('mouseout', function () {
                    this.textContent = this.dataset.originalText;
                });
            });

            document.getElementById('dynamic-scale').addEventListener('change', function () {
                isDynamicScale = this.checked;
                updateAllCells();
            });

            document.getElementById('add-row').addEventListener('click', function () {
                const newRowName = prompt('Enter new row name:');
                if (newRowName) {
                    primaryConditions.push(newRowName);
                    buildTable();
                }
            });

            document.getElementById('remove-row').addEventListener('click', function () {
                if (primaryConditions.length > 1) {
                    primaryConditions.pop();
                    buildTable();
                } else {
                    alert('Cannot remove the last row');
                }
            });

            document.getElementById('add-column').addEventListener('click', function () {
                const newColName = prompt('Enter new column name:');
                if (newColName) {
                    secondaryConditions.push(newColName);
                    buildTable();
                }
            });

            document.getElementById('remove-column').addEventListener('click', function () {
                if (secondaryConditions.length > 1) {
                    secondaryConditions.pop();
                    buildTable();
                } else {
                    alert('Cannot remove the last column');
                }
            });

            document.getElementById('back-button').addEventListener('click', function () {
                document.getElementById('editor-screen').classList.add('hidden');
                document.getElementById('welcome-screen').classList.remove('hidden');
            });

            document.getElementById('export-markdown').addEventListener('click', function () {
                exportToMarkdown();
            });

            document.getElementById('save-button').addEventListener('click', function () {
                saveMatrix();
            });

            document.getElementById('load-button').addEventListener('click', function () {
                loadMatrix();
            });
        }

        // Export to Markdown
        function exportToMarkdown() {
            const title = document.getElementById('matrix-title').textContent;
            const primaryWeights = Array.from(document.querySelectorAll('.primary-weight')).map(span => parseInt(span.textContent) || 0);
            const productCells = document.querySelectorAll('.product');

            let markdown = `# ${title}\n\n`;
            markdown += '| | Weight | ' + secondaryConditions.join(' | ') + ' |\n';
            markdown += '|---|---|' + secondaryConditions.map(() => '---').join('|') + '|\n';

            primaryConditions.forEach((p, i) => {
                let row = `| ${p} | ${primaryWeights[i]} |`;
                secondaryConditions.forEach((s, j) => {
                    const cellIndex = i * secondaryConditions.length + j;
                    const cell = productCells[cellIndex];
                    const product = parseInt(cell.dataset.product) || 0;
                    row += ` ${product} |`;
                });
                markdown += row + '\n';
            });

            document.getElementById('markdown-preview').textContent = markdown;
        }

        // Save matrix to localStorage
        function saveMatrix() {
            const title = document.getElementById('matrix-title').textContent;
            const primaryWeights = Array.from(document.querySelectorAll('.primary-weight')).map(span => parseInt(span.textContent) || 0);
            const secondaryWeights = Array.from(document.querySelectorAll('.product')).map(cell => parseInt(cell.dataset.secondaryWeight) || 1);

            const data = {
                title,
                primaryConditions,
                secondaryConditions,
                primaryWeights,
                secondaryWeights,
                isDynamicScale
            };

            localStorage.setItem('weightedMatrix', JSON.stringify(data));
            alert('Matrix saved successfully!');
        }

        // Load matrix from localStorage
        function loadMatrix() {
            const savedData = localStorage.getItem('weightedMatrix');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('matrix-title').textContent = data.title;
                primaryConditions = data.primaryConditions;
                secondaryConditions = data.secondaryConditions;
                isDynamicScale = data.isDynamicScale;
                document.getElementById('dynamic-scale').checked = isDynamicScale;

                buildTable();

                // Set weights after building table
                const primaryWeightElements = document.querySelectorAll('.primary-weight');
                primaryWeightElements.forEach((el, i) => {
                    if (data.primaryWeights[i] !== undefined) {
                        el.textContent = data.primaryWeights[i];
                    }
                });

                // Set secondary weights in the cells
                const productCells = document.querySelectorAll('.product');
                productCells.forEach((cell, i) => {
                    if (data.secondaryWeights[i] !== undefined) {
                        cell.dataset.secondaryWeight = data.secondaryWeights[i];
                    }
                });

                updateAllCells();
                alert('Matrix loaded successfully!');
            } else {
                alert('No saved matrix found!');
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function () {
            // Add event listener for the create button
            document.getElementById('create-button').addEventListener('click', function () {
                const title = document.getElementById('title').value;
                const primaryInput = document.getElementById('primary').value;
                const secondaryInput = document.getElementById('secondary').value;

                primaryConditions = primaryInput.split(',').map(item => item.trim()).filter(item => item);
                secondaryConditions = secondaryInput.split(',').map(item => item.trim()).filter(item => item);

                if (primaryConditions.length === 0 || secondaryConditions.length === 0) {
                    alert('Please enter at least one primary and secondary condition');
                    return;
                }

                document.getElementById('matrix-title').textContent = title;
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('editor-screen').classList.remove('hidden');

                buildTable();
            });
        });
    </script>
</body>

</html>
